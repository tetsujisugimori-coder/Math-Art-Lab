name: Three-body Stage AC browser-free audit
on:
  pull_request:
    branches: [main]
    paths: ['tools/three-body-stage-ac*', 'src/three-body-stage-ac.test.js', 'docs/three-body/review-44/stage-ac/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Static and mock contracts only
        run: npx vitest run --config tools/three-body-stage-ab-tests.config.mjs src/three-body-stage-ac.test.js
      - name: Actual GitHub event denial (no measurement command)
        if: github.event.pull_request.number == 44
        run: |
          node tools/three-body-stage-ac-ci.mjs
          if ($LASTEXITCODE -ne 2) { throw 'Expected closed gate for PR44' }
          exit 0
      - name: Scope
        run: echo 'Browser/GUI NOT_RUN. Mock and event-gate verification is not execution approval.' >> $env:GITHUB_STEP_SUMMARY
