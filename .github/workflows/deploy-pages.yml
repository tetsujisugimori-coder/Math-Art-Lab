name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Playwright 1.58.2 has no ubuntu26.04 browser/dependency bundles (PR #29).
    runs-on: ubuntu-24.04
    # PR #36 Validate (41944234523) took 27m before the review's composited
    # pixel matrix (20 more cases per environment; initial 18 took 5.4m locally).
    # Keep all regressions and existing test timeouts; allow the full job to finish.
    timeout-minutes: 50
    outputs:
      build-id: ${{ steps.validated.outputs.artifact-id }}
      build-digest: ${{ steps.validated.outputs.artifact-digest }}
      build-attempt: ${{ steps.build_identity.outputs.attempt }}
      build-tree-digest: ${{ steps.build_identity.outputs.tree-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build for GitHub Pages
        run: npm run build
      - name: Install Playwright browsers and system dependencies
        run: |
          # Slow Azure mirror downloads exhausted the job budget before E2E (Issue #18).
          # Keep Ubuntu suites/signatures; change only the runner's download mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit
      - name: Development regression tests
        env:
          CL_EVIDENCE: test-results/cooperation-development
        run: npm run test:e2e -- --output=test-results/development
      - name: Production build smoke tests
        env:
          CL_EVIDENCE: test-results/cooperation-production
        run: npm run test:e2e:production -- --output=test-results/production
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record validated build identity
        id: build_identity
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -z "$(find dist ! -type f ! -type d -print -quit)"
          tree_digest="$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)"
          printf 'attempt=%s\ntree-digest=%s\n' "$GITHUB_RUN_ATTEMPT" "$tree_digest" >> "$GITHUB_OUTPUT"
      - name: Save validated build
        id: validated
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BUILD_ID: ${{ needs.validate.outputs.build-id }}
      BUILD_DIGEST: ${{ needs.validate.outputs.build-digest }}
      BUILD_ATTEMPT: ${{ needs.validate.outputs.build-attempt }}
      BUILD_TREE_DIGEST: ${{ needs.validate.outputs.build-tree-digest }}
      PAGES_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify retry eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail closed if any prior attempt may have entered the deployment action.
          # A new run after an uncertain deployment requires operator reconciliation.
          for ((attempt=1; attempt<GITHUB_RUN_ATTEMPT; attempt++)); do
            jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100")"
            jq -e '
              [.[].jobs[] | select(.name == "Deploy to GitHub Pages")] |
              length == 1 and
              (.[0] | .status == "completed" and
                (.conclusion == "skipped" or
                  ([.steps[]? | select(.name == "Deploy Pages")] |
                    length == 1 and .[0].status == "completed" and .[0].conclusion == "skipped")))
            ' <<< "$jobs" >/dev/null || {
              echo "::error::Prior deployment eligibility is unknown or the deployment action was entered; reconcile before any new publication."
              exit 1
            }
          done
      - name: Verify validated artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          (( BUILD_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
          [[ "$BUILD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BUILD_TREE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          name="validated-dist-$GITHUB_RUN_ID-$BUILD_ATTEMPT"
          artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "$name" --arg id "$BUILD_ID" --arg digest "sha256:$BUILD_DIGEST" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '
            [.[].artifacts[] | select(.name == $name)] |
            length == 1 and
            (.[0] | (.id | tostring) == $id and .expired == false and .digest == $digest
              and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha)
          ' <<< "$artifacts" >/dev/null
      - name: Download validated build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.build-id }}
          digest-mismatch: error
          path: dist
      - name: Verify downloaded build tree
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -z "$(find dist ! -type f ! -type d -print -quit)"
          actual="$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$BUILD_TREE_DIGEST"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_NAME }}
          path: dist
      - name: Verify Pages artifact and current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PAGES_ID" =~ ^[1-9][0-9]*$ ]]
          artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "$PAGES_NAME" --arg id "$PAGES_ID" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '
            [.[].artifacts[] | select(.name == $name)] |
            length == 1 and
            (.[0] | (.id | tostring) == $id and .expired == false
              and (.digest | type == "string" and test("^sha256:[a-f0-9]{64}$"))
              and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha)
          ' <<< "$artifacts" >/dev/null
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA" || {
            echo "::error::main advanced; do not publish an obsolete commit."
            exit 1
          }
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_NAME }}
