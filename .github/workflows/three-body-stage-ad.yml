name: Three-body Stage AD browser-free audit
on:
  pull_request:
    branches: [main]
    paths: ['tools/three-body-stage-ad*', 'src/three-body-stage-ad.test.js', 'docs/three-body/review-44/stage-ad/**', '.github/workflows/three-body-stage-ad.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Static and mock audit only
        run: npx vitest run --config tools/three-body-stage-ab-tests.config.mjs src/three-body-stage-ad.test.js
      - name: Actual PR44 event remains prohibited
        if: github.event.pull_request.number == 44
        run: |
          node tools/three-body-stage-ac-ci.mjs
          if ($LASTEXITCODE -ne 2) { throw 'Expected BLOCKED exit 2' }
          exit 0
      - name: Scope
        run: echo 'Browser/GUI/original stop NOT_RUN; no timeout investigation trials in this job; no execution approval.' >> $env:GITHUB_STEP_SUMMARY
