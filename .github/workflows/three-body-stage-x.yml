name: Three-body Stage X bounded isolation
on:
  pull_request:
    branches: [main]
    paths: ['tools/three-body-stage-x*', 'src/three-body-stage-x*', 'docs/three-body/review-44/stage-x/**', '.github/workflows/three-body-stage-x.yml']
permissions:
  contents: read
  actions: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute fixed acquisition once or re-audit existing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/three-body-stage-x-pipeline.mjs test-results/stage-x
      - name: Preserve every attempted trial and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage-x-evidence-${{ github.sha }}
          path: test-results/stage-x/
          if-no-files-found: error
          retention-days: 90
